name: Qode Collector

on:
  push:
    branches: [main]
    paths-ignore:
      - 'nodes_featured_12h.txt'
      - 'nodes_full_24h.txt'
      - 'report/**'

  schedule:
    - cron: '0 */12 * * *'
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  featured:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: qode-push-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Qode (featured)
        env:
          SOURCES_KEY: ${{ secrets.SOURCES_KEY }}
        run: python qode.py featured

      - name: Stage outputs
        run: |
          git add -A

      - name: Pull before push
        run: |
          git pull --rebase origin main || true

      - name: Commit & Push (featured)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update featured outputs [skip ci]"
          file_pattern: "nodes_featured_12h.txt report/"

  full:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: qode-push-main
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Qode (full)
        env:
          SOURCES_KEY: ${{ secrets.SOURCES_KEY }}
        run: python qode.py full

      - name: Stage outputs
        run: |
          git add -A

      - name: Pull before push
        run: |
          git pull --rebase origin main || true

      - name: Commit & Push (full)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update full outputs [skip ci]"
          file_pattern: "nodes_full_24h.txt report/"

  both:
    needs: [featured, full]
    runs-on: ubuntu-latest
    steps:
      - name: Done
        run: echo "Both pipelines finished."