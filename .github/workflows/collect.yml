name: Qode Collector

on:
  push:
    branches: [main]
    paths-ignore:
      - 'nodes_featured_12h.txt'
      - 'nodes_full_24h.txt'
      - 'report/**'

  schedule:
    - cron: '0 */12 * * *'
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Qode (both)
        env:
          SOURCES_KEY: ${{ secrets.SOURCES_KEY }}
        run: python qode.py both

      - name: Stage all changes
        run: |
          git add -A

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update outputs and reports [skip ci]"